<style>
/* 狂草字型已子集化（只含標題與 27 型名稱用字）；改名稱後需重新產生 kuangcao.woff2，見 CLAUDE.md */
@font-face{font-family:'KuangCao';src:url('./kuangcao.woff2') format('woff2');font-display:swap}
@property --bd-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
@keyframes dotSlide{from{left:50%}to{left:var(--pos)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes cspin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes shine{from{left:-100%}to{left:200%}}
@keyframes borderSpin{to{--bd-angle:360deg}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes kenBurns{from{transform:scale(1.04) translateY(0)}to{transform:scale(1.12) translateY(-1.5%)}}
@keyframes brushIn{from{clip-path:inset(0 100% 0 0);filter:blur(6px);opacity:0}to{clip-path:inset(0 0 0 0);filter:blur(0);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes orbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes radarGrow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rayspin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ripple{from{transform:scale(0);opacity:.5}to{transform:scale(2.4);opacity:0}}

:root{
--bg:#0B1026;--bg2:#111A33;--ink:#070B1C;
--card:rgba(17,24,48,.72);--card2:rgba(24,34,66,.78);--glass:blur(12px) saturate(1.2);
--tx:#F3EAD3;--tx2:#C3CCDE;--tx3:#93A0B8;
--gold:#E8C36A;--gold2:#FFE6A3;--gold3:#B8862F;--jade:#5FD3B0;--cyan:#7FD6E8;
--bd:rgba(232,195,106,.28);--bd2:rgba(232,195,106,.5);--bdui:#6B7A93;
--axA:#FB923C;--axA2:#FDBA74;--axB:#22D3EE;--axB2:#67E8F9;--axC:#E879F9;--axC2:#F0ABFC;
--ok:#5FD3B0;
--r:18px;--r2:12px;
--sh:0 8px 30px rgba(0,0,0,.35);
--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
--sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip;background:var(--ink)}
body{font-family:var(--sans);background:var(--ink);color:var(--tx);line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100svh;overflow-x:clip}
.hidden{display:none!important}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
img{max-width:100%}

/* ===== 背景層 ===== */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.bg-img{position:absolute;inset:-2%;background:url(img/bg/home_mobile.webp) center 30%/cover no-repeat;animation:kenBurns 40s ease-in-out infinite alternate;will-change:transform}
body.v-result .bg-img{background-image:url(img/bg/result_mobile.webp);background-position:center bottom}
.bg-veil{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 38%,rgba(11,16,38,.15),rgba(7,11,28,.55) 75%),linear-gradient(180deg,rgba(7,11,28,.25),rgba(7,11,28,.1) 40%,rgba(7,11,28,.55))}
body.v-quiz .bg-veil,body.v-result .bg-veil{background:linear-gradient(180deg,rgba(7,11,28,.55),rgba(7,11,28,.4) 50%,rgba(7,11,28,.6))}
#motes{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
@media (min-width:768px) and (min-aspect-ratio:1/1){.bg-img{background-image:url(img/bg/home_desktop.webp);background-position:center 40%}}

.wrap{max-width:680px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));position:relative;z-index:2}

/* ===== 按鈕 ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border:none;border-radius:999px;font-size:1.05rem;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;font-family:var(--serif);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.btn-go{background:linear-gradient(135deg,#FFE6A3,#E8C36A 45%,#B8862F);color:#1A1206;box-shadow:0 0 0 1px rgba(255,230,163,.6) inset,0 6px 26px rgba(232,195,106,.45),0 0 60px rgba(232,195,106,.18)}
.btn-go::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,230,163,.8) inset,0 10px 34px rgba(232,195,106,.6),0 0 80px rgba(232,195,106,.25)}
.btn-go:active{transform:scale(.98)}
.btn-go:disabled{background:#3A4258;color:#8B93A7;cursor:not-allowed;transform:none;box-shadow:none}
.btn-go:disabled::after{display:none}
.btn-alt,.btn-prev{background:rgba(17,24,48,.6);color:var(--gold2);border:1.5px solid var(--bd2);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.btn-alt:hover,.btn-prev:hover{background:rgba(232,195,106,.12)}
.btn-alt{margin-top:10px}
@keyframes ctaGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,230,163,.6) inset,0 6px 26px rgba(232,195,106,.45),0 0 40px rgba(232,195,106,.15)}50%{box-shadow:0 0 0 1px rgba(255,230,163,.9) inset,0 6px 30px rgba(232,195,106,.7),0 0 80px rgba(232,195,106,.35)}}
.btn-xian{animation:ctaGlow 2.6s ease-in-out infinite}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn .ui-ico{width:20px;height:20px}

/* ===== 首頁 ===== */
.w-hero{min-height:calc(100svh - 32px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2svh,18px);padding-top:env(safe-area-inset-top)}
.w-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-family:var(--serif);font-size:.78rem;letter-spacing:.3em;color:var(--gold2);background:rgba(11,16,38,.5);border:1px solid var(--bd2);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);animation:fadeUp .8s ease-out both}
.w-title{font-family:'KuangCao',var(--serif);font-weight:normal;font-size:clamp(3.6rem,19vw,7.5rem);line-height:1.05;display:flex;justify-content:center;gap:.02em;width:100%;
 background:linear-gradient(180deg,#FFF6DA 10%,#F2CF73 55%,#B8862F 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 18px rgba(232,195,106,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.w-title span{display:inline-block;animation:brushIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.w-title span:nth-child(2){animation-delay:.18s}.w-title span:nth-child(3){animation-delay:.36s}.w-title span:nth-child(4){animation-delay:.54s}
.w-sub{text-wrap:balance;font-family:var(--serif);color:var(--tx);font-size:clamp(.92rem,3.8vw,1.08rem);max-width:26em;text-shadow:0 2px 10px rgba(0,0,0,.8);animation:fadeUp .8s ease-out .6s both}
.w-meta{font-size:.78rem;color:var(--tx2);letter-spacing:.2em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.w-cta{width:min(100%,360px);animation:fadeUp .8s ease-out .9s both}
.scroll-hint{font-size:.72rem;color:var(--tx3);letter-spacing:.3em;animation:floatY 2.4s ease-in-out infinite;margin-top:4px}

/* 太極五行陣（全部用百分比，手機不跑版） */
.array{position:relative;width:min(70vw,340px,40svh);aspect-ratio:1;margin:clamp(4px,1svh,12px) auto;animation:fadeUp 1s ease-out .3s both}
.array::before{content:'';position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(232,195,106,.32),rgba(127,214,232,.1) 45%,transparent 70%);animation:breathe 4s ease-in-out infinite}
.array-rays{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,230,163,.13) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:rayspin 90s linear infinite;pointer-events:none}
.array-ring{position:absolute;inset:0;animation:spin 80s linear infinite}
.array-ring svg{width:100%;height:100%;display:block}
.wx-orbit{position:absolute;inset:0;animation:spin 60s linear infinite}
.wx-node{position:absolute;width:21%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translate(-50%,-50%);animation:cspin 60s linear infinite;background:radial-gradient(circle at 35% 30%,rgba(40,52,92,.95),rgba(11,16,38,.95));border:1.5px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 35%,transparent)}
.wx-node .el-ico{width:52%;height:52%}
.wx-node b{font-family:var(--serif);font-size:clamp(.6rem,2.6vw,.8rem);color:var(--c);line-height:1;margin-top:2px}
.wx-0{left:50%;top:6%}.wx-1{left:91.8%;top:36.4%}.wx-2{left:75.9%;top:85.6%}.wx-3{left:24.1%;top:85.6%}.wx-4{left:8.2%;top:36.4%}

/* 首頁區塊 */
.w-sec{margin:28px 0 8px;animation:fadeUp .8s ease-out both}
.sec-title{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.35em;color:var(--gold2);margin-bottom:6px;text-shadow:0 0 14px rgba(232,195,106,.5)}
.sec-title::before,.sec-title::after{content:'';flex:0 1 60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.sec-title::after{transform:scaleX(-1)}
.sec-sub{text-align:center;font-size:.82rem;color:var(--tx2);margin-bottom:14px}
.root-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.root-card{position:relative;padding:14px 8px 12px;border-radius:var(--r2);text-align:center;background:var(--card);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);overflow:hidden;transition:transform .3s}
.root-card::before{content:'';position:absolute;left:50%;top:-30%;width:120%;aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%);pointer-events:none}
.root-card:hover{transform:translateY(-3px)}
.root-card .el-ico{width:38px;height:38px;margin:0 auto 4px;position:relative;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent))}
.root-card b{display:block;font-family:var(--serif);font-size:.92rem;color:var(--c);position:relative}
.root-card span{display:block;font-size:.7rem;color:var(--tx2);line-height:1.5;position:relative}
.root-card.var{border-style:dashed}

/* 二十七修士畫廊 */
.gallery{position:relative;overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));padding:8px 0 4px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.g-track{display:flex;gap:12px;width:max-content;animation:marquee 70s linear infinite}
.gallery:hover .g-track{animation-play-state:paused}
.g-card{width:110px;flex-shrink:0;text-align:center}
.g-pic{width:110px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#F4E9D2;border:1.5px solid var(--bd2);box-shadow:0 0 18px rgba(232,195,106,.2);position:relative}
.g-pic img{width:100%;height:100%;object-fit:cover;object-position:top;mix-blend-mode:multiply;display:block}
.g-name{font-family:'KuangCao',var(--serif);font-size:1.6rem;line-height:1.3;color:var(--gold2);text-shadow:0 0 10px rgba(232,195,106,.5)}
.g-code{font-size:.66rem;color:var(--tx3);letter-spacing:.2em}

/* ===== 問卷 ===== */
.prog{position:sticky;top:0;z-index:50;margin:0 -4px;padding:calc(10px + env(safe-area-inset-top)) 4px 10px;background:linear-gradient(180deg,rgba(7,11,28,.92),rgba(7,11,28,.75));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--bd)}
.prog-inner{display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;background:rgba(255,255,255,.08);border-radius:6px;height:8px;overflow:hidden;border:1px solid rgba(232,195,106,.2)}
.prog-fill{background:linear-gradient(90deg,#B8862F,#FFE6A3);height:100%;width:0;transition:width .4s;border-radius:6px;box-shadow:0 0 12px rgba(232,195,106,.8)}
.prog-num{font-size:.85rem;color:var(--tx2);font-weight:600}.prog-num b{color:var(--gold2)}
.page-ind{text-align:center;margin:14px 0;font-family:var(--serif);font-size:.85rem;letter-spacing:.3em;color:var(--gold2)}
.qcard{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px 18px;margin-bottom:12px;box-shadow:var(--sh);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);transition:border-color .3s,box-shadow .3s;animation:fadeUp .45s ease-out both}
.qcard.done{border-color:rgba(95,211,176,.55);box-shadow:var(--sh),0 0 18px rgba(95,211,176,.12)}
.qnum{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.72rem;letter-spacing:.15em;background:rgba(232,195,106,.12);color:var(--gold2);border:1px solid var(--bd);margin-bottom:8px}
.qtxt{font-family:var(--serif);font-size:1.02rem;font-weight:600;margin-bottom:14px;line-height:1.8;color:var(--tx)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;align-items:flex-start;min-height:48px;padding:12px 14px;background:rgba(7,11,28,.45);border-radius:var(--r2);cursor:pointer;border:1.5px solid rgba(107,122,147,.55);transition:all .2s;overflow:hidden;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--bd2);background:rgba(232,195,106,.07)}
.opt.sel{background:linear-gradient(135deg,rgba(232,195,106,.2),rgba(232,195,106,.06));border-color:var(--gold);box-shadow:0 0 16px rgba(232,195,106,.25)}
.opt.sel::after{content:'';position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,163,.55),transparent 65%);animation:ripple .7s ease-out forwards;pointer-events:none}
.opt input{display:none}
.dot{width:20px;height:20px;border:2px solid var(--bdui);border-radius:50%;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .25s}
.opt.sel .dot{border-color:var(--gold);background:var(--gold);box-shadow:0 0 10px var(--gold)}
.opt.sel .dot::after{content:'';width:7px;height:7px;background:#1A1206;border-radius:50%}
.opt-t{font-size:.95rem;color:var(--tx2);line-height:1.65}
.opt.sel .opt-t{color:var(--tx);font-weight:600}
.nav-row{display:flex;gap:10px;margin-top:14px}
.nav-row .btn{flex:1}

/* ===== 結果頁 ===== */
.res-enter{animation:pop .6s ease-out}
.r-hero{position:relative;text-align:center;padding:10px 0 18px}
.hc-badge{display:inline-block;padding:5px 16px;border-radius:999px;font-family:var(--serif);font-size:.78rem;letter-spacing:.3em;color:var(--gold2);background:rgba(11,16,38,.6);border:1px solid var(--bd2)}
.stage{position:relative;width:min(300px,72vw);margin:26px auto 10px}
.stage-rays{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:190%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--g1) 30%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 25%,transparent 66%);animation:rayspin 60s linear infinite;pointer-events:none}
.stage-ring{position:absolute;left:50%;top:48%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.stage-ring svg{width:100%;height:100%;animation:spin 50s linear infinite}
.frame{position:relative;padding:3px;border-radius:14px;background:linear-gradient(160deg,#FFE6A3,#B8862F 35%,#F2CF73 60%,#8A6420);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 40px rgba(232,195,106,.45),0 0 90px color-mix(in srgb,var(--g1) 45%,transparent);animation:floatY 6s ease-in-out infinite}
.frame-in{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#FBF4E2,#EBDDBE 70%,#D9C59B)}
.frame-in::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 30px rgba(120,80,20,.35);border-radius:inherit;pointer-events:none}
.portrait-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 72% 78% at 50% 44%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 72% 78% at 50% 44%,#000 72%,transparent 100%)}
.portrait-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center}
.corner{position:absolute;width:34px;height:34px;pointer-events:none;z-index:3}
.corner svg{width:100%;height:100%}
.c-tl{left:-8px;top:-8px}.c-tr{right:-8px;top:-8px;transform:scaleX(-1)}.c-bl{left:-8px;bottom:-8px;transform:scaleY(-1)}.c-br{right:-8px;bottom:-8px;transform:scale(-1)}
.orb-badge{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#28345C,#0B1026);border:1.5px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent);display:flex;align-items:center;justify-content:center;animation:orbBob 3.6s ease-in-out infinite;z-index:4}
.orb-badge .el-ico{width:26px;height:26px}
.ob0{left:-22px;top:12%}.ob1{right:-22px;top:26%}.ob2{left:-22px;top:46%}.ob3{right:-22px;top:60%}.ob4{left:-14px;top:78%}
.hc-name{font-family:'KuangCao',var(--serif);font-weight:normal;font-size:clamp(3.4rem,17vw,4.6rem);line-height:1.1;margin-top:14px;background:linear-gradient(180deg,#FFF6DA,#F2CF73 55%,#B8862F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--g1) 70%,transparent)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.hc-en{font-size:.82rem;color:var(--tx2);letter-spacing:.2em;margin-bottom:12px}
.chip-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.el-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--c);background:rgba(11,16,38,.7);border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 25%,transparent)}
.el-chip.var{border-style:dashed}
.el-ico{width:1.15em;height:1.15em;flex-shrink:0;display:block}
.ui-ico{width:18px;height:18px;flex-shrink:0}

{id:1,q:"一群人要吃飯，一直決定不了，時間也有點晚了，你通常會？",o:[{t:"先決定一個方向，邊走邊問大家意見",s:{A:1}},{t:"先問有沒有人不能吃什麼，等大家都說好再走",s:{A:-2}},{t:"直接挑一家最近的，先填飽肚子再說",s:{A:2}},{t:"看情況：大家很餓就直接挑，不急就慢慢問",s:{A:0}}]},

var axD={A:{h:"在需要做取捨的時候，你傾向先推進度、先解決問題。當時間有限，你會選擇先把事情搞定，再回頭處理人的感受。這不代表你不在乎人，而是在壓力下你的本能反應是「先做完再說」。在團隊中，你常常是那個推動進度的人，即使這有時會讓別人覺得你太急。",m:"你在「先做事」和「先顧人」之間沒有固定偏好，會根據當下的情況靈活切換。有時候你會很果斷地推進事情，有時候你又很自然地先顧慮到人的感受。這種彈性是你的優勢——你不會被框在某一種模式裡。但偶爾你可能會不確定自己到底偏向哪邊。",l:"在需要做取捨的時候，你傾向先確認人的狀態。事情可以慢一點，但人不能不舒服。你天生對別人的情緒很敏感，會不自覺地先考慮「這樣做大家會不會不開心」。這讓你成為團隊裡讓人安心的存在，但也可能讓你在需要快速決策時有些猶豫。"},B:{h:"跟人在一起會讓你充電。獨處太久你會悶，你需要社交互動來維持精力和動力。熱鬧的環境讓你感到自在，你在人群中反而更能思考、更有靈感。不過這不代表你膚淺或害怕獨處——你只是從人際互動中獲得更多能量。",m:"你的能量來源不固定——有時候需要人陪，有時候需要獨處，完全取決於當下的狀態和心情。你不會特別渴望社交，也不會特別抗拒。這種平衡讓你在各種場合都能適應，但有時你可能需要主動覺察自己當下到底需要什麼。",l:"社交活動會消耗你的能量，即使過程很開心，結束後你還是需要一段時間獨處來恢復。你的內在世界很豐富，獨處對你來說不是寂寞而是充電。你喜歡深度的一對一互動勝過大群體社交，選擇性地把能量花在真正在乎的人身上。"},C:{h:"你很清楚自己想要什麼，外界的聲音不太容易改變你的判斷。你不是固執，而是內心有一套自己的標準和邏輯。做決定的時候你主要依靠自己的判斷，別人的意見你會聽但不一定會採納。這種獨立性讓你很有主見，但也要留意是否偶爾錯過了別人的好建議。",m:"你在「聽自己的」和「參考別人的」之間保持彈性。有些事你很有主見，有些事你願意順著大家。你不會為了跟別人不同而堅持，也不會為了合群而放棄自己的想法。這種靈活度讓你能在保持自我的同時也顧及到周圍人的感受。",l:"別人怎麼看你、怎麼想你，對你來說是很重要的考量。做決定的時候你會自然地把身邊的人的反應納入考量。你很善於讀懂別人的期待，這讓你在社交中很受歡迎。但要留意不要為了別人的眼光而忽略了自己真正想要的。"}};

var ans={},TOT=Q.length,PG=0,PAGES=6;
var _saved=sessionStorage.getItem('gt_v1_answers_v2');
if(_saved)try{ans=JSON.parse(_saved)}catch(e){}

function go(){
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  setView('quiz');
  renderPage(0);
}

function renderPage(pg){
  PG=pg;
  var start=pg*5,end=Math.min(start+5,TOT);
  document.getElementById('pgInd').textContent='第 '+(pg+1)+' / '+PAGES+' 頁';
  var h='';
  for(var i=start;i<end;i++){
    var q=Q[i];
    h+='<div class="qcard'+(ans[q.id]!==undefined?' done':'')+'" id="qc'+q.id+'" style="animation-delay:'+((i-start)*.06)+'s">';
    h+='<div class="qnum mono">Q'+q.id+'</div>';
    h+='<div class="qtxt">'+q.q+'</div><div class="opts" role="radiogroup">';
    q.o.forEach(function(o,j){
      var sel=ans[q.id]===j?' sel':'';
      h+='<div class="opt'+sel+'" role="radio" tabindex="0" aria-checked="'+(sel?'true':'false')+'" onclick="pk('+q.id+','+j+')" onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();pk('+q.id+','+j+')}"><input type="radio" name="q'+q.id+'"><div class="dot"></div><div class="opt-t">'+o.t+'</div></div>';
    });
    h+='</div></div>';
  }
  document.getElementById('qW').innerHTML=h;

  var nav='';
  if(pg>0) nav+='<button class="btn btn-prev" onclick="renderPage('+(pg-1)+')">← 上一頁</button>';
  if(pg<PAGES-1){
    nav+='<button class="btn btn-go" id="nxBtn" onclick="renderPage('+(pg+1)+')">下一頁 →</button>';
  }else{
    var allDone=Object.keys(ans).length>=TOT;
    nav+='<button class="btn btn-go" id="nxBtn" onclick="calc()"'+(allDone?'':' disabled')+'>查看結果 →</button>';
  }
  document.getElementById('navRow').innerHTML=nav;
  updProg();
  window.scrollTo({top:0,behavior:'smooth'});
}

function pk(qi,oi){
  var c=document.getElementById('qc'+qi);
  c.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');o.setAttribute('aria-checked','false')});c.querySelectorAll('.opt')[oi].setAttribute('aria-checked','true');
  c.querySelectorAll('.opt')[oi].classList.add('sel');c.classList.add('done');
  ans[qi]=oi;
  sessionStorage.setItem('gt_v1_answers_v2',JSON.stringify(ans));
  updProg();
  if(PG===PAGES-1){var nb=document.getElementById('nxBtn');if(nb)nb.disabled=Object.keys(ans).length<TOT;}
}

function updProg(){
  var n=Object.keys(ans).length;
  document.getElementById('pF').style.width=(n/TOT*100)+'%';
  document.getElementById('pN').textContent=n;
}

// 計分：各軸選項的加減分不對稱（例如 A 軸加分總量遠大於扣分），
// 所以先算出「每題隨機作答」的期望值 mu 與標準差 sd 當作中點與尺度，
// 再用 tanh 平滑映射到 -10~+10。|分數| >= TH 才給正/負端字母。
// 隨機作答時每軸約 1/3 落在中間帶，三軸皆中間（BMA）約 5%；作答越一致越不會落入中間。
var TH=1.7,AXK=2.5;
var AXST=(function(){var mu={A:0,B:0,C:0},vr={A:0,B:0,C:0};Q.forEach(function(q){['A','B','C'].forEach(function(a){var v=q.o.map(function(o){return o.s[a]||0}),m=(v[0]+v[1]+v[2]+v[3])/4;mu[a]+=m;v.forEach(function(x){vr[a]+=(x-m)*(x-m)/4});});});return {mu:mu,sd:{A:Math.sqrt(vr.A),B:Math.sqrt(vr.B),C:Math.sqrt(vr.C)}};})();
function letterOf(a,v){var L={A:'GBP',B:'EMI',C:'SAO'}[a];return v>=TH?L[0]:v<=-TH?L[2]:L[1];}
function calc(){
  var raw={A:0,B:0,C:0};
  Q.forEach(function(q){var oi=ans[q.id];if(oi===undefined)return;var sc=q.o[oi].s;['A','B','C'].forEach(function(a){raw[a]+=(sc[a]||0);});});
  var nm={};['A','B','C'].forEach(function(a){var z=(raw[a]-AXST.mu[a])/AXST.sd[a];nm[a]=Math.round(100*Math.tanh(z/AXK))/10;});
  show(nm,letterOf('A',nm.A)+letterOf('B',nm.B)+letterOf('C',nm.C));
}

    svg+='<path d="M62 54 Q58 62 56 85 Q54 100 60 115 L80 120 L100 115 Q106 100 104 85 Q102 62 98 54 Q90 50 80 50 Q70 50 62 54Z" fill="url(#charG)" opacity=".7"/>';
    svg+='<path d="M56 100 Q48 115 45 125 Q50 130 60 128" stroke="url(#charG)" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>';// crossed leg left

// 六靈根雷達：對角為同一軸兩端（金↔木、火↔水、土↔月），每端 = (10 ± 分數) / 2
var RADAR=[['金','目標','A',1],['火','外向','B',1],['土','自我','C',1],['木','關係','A',-1],['水','內向','B',-1],['月','他人','C',-1]];
function radar(nm){
  var R=100,band=[(10-TH)/2,(10+TH)/2];
  function pt(i,v){var a=(i*60-90)*Math.PI/180;return [v/10*R*Math.cos(a),v/10*R*Math.sin(a)];}
  function hex(v){return RADAR.map(function(_,i){return pt(i,v).map(function(n){return n.toFixed(1)}).join(',')}).join(' ');}
  var vals=RADAR.map(function(d){return (10+d[3]*nm[d[2]])/2;});
  var lbl=RADAR.map(function(d,i){return d[0]+d[1]+' '+vals[i].toFixed(1);}).join('、');
  var s='<div class="radar-wrap"><svg class="radar" viewBox="-170 -166 340 336" role="img" aria-label="六靈根雷達：'+lbl+'">';
  s+='<defs><radialGradient id="rdF" r=".6"><stop offset="0" stop-color="#FFE6A3" stop-opacity=".05"/><stop offset="1" stop-color="#FFE6A3" stop-opacity=".28"/></radialGradient><filter id="rdG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  s+='<circle r="'+(R+8)+'" fill="rgba(7,11,28,.45)" stroke="rgba(232,195,106,.25)"/>';
  // 中庸帶
  var outer=RADAR.map(function(_,i){return pt(i,band[1]).join(',')}),inner=RADAR.map(function(_,i){return pt(i,band[0]).join(',')});
  s+='<path d="M'+outer.join('L')+'Z M'+inner.reverse().join('L')+'Z" fill="rgba(255,255,255,.07)" fill-rule="evenodd" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 3" stroke-width=".8"/>';
  [2,4,6,8,10].forEach(function(v){s+='<polygon points="'+hex(v)+'" fill="none" stroke="rgba(232,195,106,'+(v===10?.55:.2)+')" stroke-width="'+(v===10?1.2:.8)+'"/>';});
  RADAR.forEach(function(d,i){var p=pt(i,10);s+='<line x1="0" y1="0" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(232,195,106,.25)" stroke-width=".8"/>';});
  [2,4,6,8].forEach(function(v){var p=pt(0,v);s+='<text x="'+(p[0]+4)+'" y="'+(p[1]+3)+'" font-size="8" fill="rgba(195,204,222,.55)">'+v+'</text>';});
  var poly=vals.map(function(v,i){return pt(i,v).map(function(n){return n.toFixed(1)}).join(',')}).join(' ');
  s+='<g class="poly"><polygon points="'+poly+'" fill="url(#rdF)" stroke="#FDE68A" stroke-width="2.2" stroke-linejoin="round" filter="url(#rdG)"/>';
  vals.forEach(function(v,i){var p=pt(i,v),inBand=v>band[0]&&v<band[1],pref=v>=band[1];
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+(pref?LT[RADAR[i][0]]:'#0B1026')+'" stroke="'+(inBand?'#94A3B8':LT[RADAR[i][0]])+'" stroke-width="2"/>';});
  s+='</g>';
  RADAR.forEach(function(d,i){
    var p=pt(i,11.8),x=p[0],y=p[1],side=i===0?'top':i===3?'bot':(x>0?'r':'l');
    var anchor=side==='top'||side==='bot'?'middle':side==='r'?'start':'end';
    if(side==='r')x+=6;if(side==='l')x-=6;
    var iy,ny;
    if(side==='top'){iy=y-44;ny=y-12;}else if(side==='bot'){iy=y-8;ny=y+26;}else{iy=y-32;ny=y-2;}
    var ix=anchor==='middle'?x-9:anchor==='start'?x:x-18;
    s+=ICO[d[0]].replace('<svg ','<svg x="'+ix.toFixed(1)+'" y="'+iy.toFixed(1)+'" width="18" height="18" ');
    s+='<text x="'+x.toFixed(1)+'" y="'+ny.toFixed(1)+'" text-anchor="'+anchor+'" font-size="12.5" font-weight="700" fill="'+LT[d[0]]+'">'+d[0]+'・'+d[1]+'</text>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(ny+15).toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" font-weight="700" fill="#F3EAD3" class="mono">'+vals[i].toFixed(1)+'</text>';
  });
  return s+'</svg></div>';
}

function shareRes(){

  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(ok,function(){prompt('複製這個連結：',url);});}
  else{var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){prompt('複製這個連結：',url);}document.body.removeChild(ta);}

function bAxis(a,val,idx){
  var pct=(val+10)/20*100,c=axC[a],fl,fw;
  if(val>=0){fl=50;fw=pct-50}else{fl=pct;fw=50-pct}
  var dy=(.1+idx*.1)+'s';
  return '<div class="axis-vis"><div class="axis-head"><span class="axis-name" style="color:'+c[0]+'">'+axN[a]+'</span><span class="axis-score mono" style="color:'+c[0]+'">'+(val>=0?'+':'')+val.toFixed(1)+'</span></div><div class="axis-track"><div class="axis-track-inner"><div class="axis-band" title="中庸帶"></div><div class="axis-bar" style="left:'+fl+'%;--w:'+fw+'%;background:linear-gradient(90deg,'+c[0]+','+c[1]+');opacity:.55;animation-delay:'+dy+'"></div></div><div class="axis-mid"></div><div class="axis-marker" style="--pos:'+pct+'%;background:'+c[0]+';box-shadow:0 0 12px '+c[0]+';animation-delay:'+dy+'"></div></div><div class="axis-labels"><span>'+axNg[a]+'</span><span class="mid">中庸帶</span><span>'+axP[a]+'</span></div></div>';
}

// 首頁：靈根卡、變異卡、二十七修士畫廊
function initHome(){
  var rg='';
  [['金','目標導向'],['木','關係導向'],['火','外向充電'],['水','內向充電'],['土','自我導向'],['月','他人導向']].forEach(function(d){rg+='<div class="root-card" style="--c:'+LT[d[0]]+'">'+ico(d[0])+'<b>'+ROOT_INFO[d[0]].label+'</b><span>'+d[1]+'<br>'+ROOT_INFO[d[0]].desc+'</span></div>';});
  document.getElementById('rootGrid').innerHTML=rg;
  var vg='';
  ['雷','風','冰'].forEach(function(n){var v=VARIANT_INFO[n];vg+='<div class="root-card var" style="--c:'+LT[n]+'">'+ico(n)+'<b>'+v.label+'</b><span>'+v.origin+'</span></div>';});
  document.getElementById('varGrid').innerHTML=vg;
  var cards=Object.keys(T).map(function(k){return '<div class="g-card"><div class="g-pic"><img src="img/thumb/'+k+'.webp" alt="'+T[k].n+'" loading="lazy" width="240" height="360"></div><div class="g-name">'+T[k].n+'</div><div class="g-code mono">'+k+'</div></div>';}).join('');
  document.getElementById('gTrack').innerHTML=cards+cards.replace(/alt="[^"]*"/g,'alt="" aria-hidden="true"');
}

// 靈光粒子
function initMotes(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('motes');if(!cv||!cv.getContext)return;
  var cx=cv.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2),P=[],N=window.innerWidth<600?26:48;
  var cols=['255,230,163','232,195,106','127,214,232','255,246,218'];
  function rs(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;}
  function mk(init){return {x:Math.random()*W,y:init?Math.random()*H:H+20*dpr,r:(Math.random()*1.8+.6)*dpr,v:(Math.random()*.35+.15)*dpr,d:Math.random()*Math.PI*2,c:cols[Math.random()*cols.length|0],t:Math.random()*Math.PI*2};}
  rs();addEventListener('resize',rs);
  for(var i=0;i<N;i++)P.push(mk(true));
  (function loop(){
    if(!document.hidden){
      cx.clearRect(0,0,W,H);
      P.forEach(function(p,i){
        p.y-=p.v;p.t+=.02;p.x+=Math.sin(p.t+p.d)*.3*dpr;
        if(p.y<-20)P[i]=mk(false);
        var a=.45+.45*Math.sin(p.t*2),g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
        g.addColorStop(0,'rgba('+p.c+','+a+')');g.addColorStop(1,'rgba('+p.c+',0)');
        cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*5,0,Math.PI*2);cx.fill();
      });
    }
    requestAnimationFrame(loop);
  })();
}

document.addEventListener('DOMContentLoaded',function(){
  initHome();
  document.querySelectorAll('[data-ico]').forEach(function(el){el.outerHTML=ico(el.getAttribute('data-ico'));});
  initMotes();
  var h=window.location.hash;
  if(h.indexOf('result=')>-1){
    var ps={};h.replace('#','').split('&').forEach(function(p){var kv=p.split('=');ps[kv[0]]=kv[1];});
    var nm={A:parseFloat(ps.A),B:parseFloat(ps.B),C:parseFloat(ps.C)};
    if(T[ps.result]&&!isNaN(nm.A)&&!isNaN(nm.B)&&!isNaN(nm.C))show(nm,ps.result);
  }
});
</script>
